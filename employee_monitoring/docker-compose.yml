services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: employee_monitoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@db:5432/employee_monitoring
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
